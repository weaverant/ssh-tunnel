services:
  ssh-tunnel:
    build: .
    ports:
      - "2222:2222"
    volumes:
      # ssh_host_ed25519_key and/or ssh_host_mldsa44_ed25519_key, see README
      - ./host_keys:/etc/ssh/host_keys:ro
      - ./authorized_keys:/etc/ssh/authorized_keys:ro
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID       # privsep user switching
      - SETGID       # privsep group switching
      - SYS_CHROOT   # privsep chroot
      - DAC_OVERRIDE  # read host key / authorized_keys
    restart: unless-stopped
