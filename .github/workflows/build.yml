name: Build and Push

on:
  push:
    tags:
      - 'v*'

# Two tags pushed back to back raced here once: v0.1.3 and v0.1.4 built in
# parallel and v0.1.3 finished last, so it claimed the moving tags.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need every tag to work out which is newest

      # Both `latest` and `<major>.<minor>` move, so an older tag rebuilt after a
      # newer one must not claim either. Assumes no prerelease tags: git's
      # version sort puts v1.0.0-rc1 after v1.0.0 unless versionsort.suffix is set.
      - name: Which moving tags may this release claim?
        id: rel
        run: |
          ref=$GITHUB_REF_NAME
          line=${ref%.*}
          newest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          newest_in_line=$(git tag -l "$line.*" --sort=-v:refname | head -1)
          echo "building $ref -- newest overall $newest, newest in $line line $newest_in_line"
          [ "$ref" = "$newest" ] && latest=true || latest=false
          [ "$ref" = "$newest_in_line" ] && minor=true || minor=false
          echo "claims latest=$latest, ${line#v}=$minor"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=${{ steps.rel.outputs.latest }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.rel.outputs.minor }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}`
